services:

  homepage:
    image: nginx:alpine
    container_name: cloudbase-homepage
    ports:
      - "${HOMEPAGE_PORT:-8080}:80"
    volumes:
      - ./homepage:/usr/share/nginx/html:ro
    restart: unless-stopped
    networks:
      - cloudbase
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3

  nextcloud:
    image: nextcloud:29
    container_name: cloudbase-nextcloud
    ports:
      - "${NEXTCLOUD_PORT:-8081}:80"
    environment:
      MYSQL_HOST: mariadb
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
    volumes:
      - nextcloud_data:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - cloudbase

  mariadb:
    image: mariadb:lts
    container_name: cloudbase-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - cloudbase
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:alpine
    container_name: cloudbase-redis
    restart: unless-stopped
    networks:
      - cloudbase
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  adminer:
    image: adminer:latest
    container_name: cloudbase-adminer
    ports:
      - "${ADMINER_PORT:-8082}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mariadb
      ADMINER_DESIGN: dracula
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cloudbase

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: cloudbase-uptime-kuma
    ports:
      - "${UPTIMEKUMA_PORT:-8083}:3001"
    volumes:
      - uptimekuma_data:/app/data
    restart: unless-stopped
    networks:
      - cloudbase
    healthcheck:
      test: ["CMD", "extra/healthcheck"]
      interval: 60s
      timeout: 30s
      retries: 5

volumes:
  nextcloud_data:
    name: cloudbase_nextcloud_data
  mariadb_data:
    name: cloudbase_mariadb_data
  uptimekuma_data:
    name: cloudbase_uptimekuma_data

networks:
  cloudbase:
    driver: bridge
    name: cloudbase_network
