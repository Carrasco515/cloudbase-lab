services:

  traefik:
    image: traefik:v3.6
    container_name: cloudbase-traefik
    command:
      # --- Providers ---
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=cloudbase_network"
      # --- Entrypoints ---
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Redirect all plain HTTP to HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # --- Dashboard (served over the secure entrypoint, local hostname only) ---
      - "--api.dashboard=true"
      - "--log.level=INFO"
      # NOTE: No certificate resolver configured yet, so Traefik serves its
      # built-in self-signed certificate on :443. Enable Let's Encrypt only
      # once a real, publicly resolvable domain is configured (see README).
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Read-only access to the Docker API for service discovery.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - cloudbase
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${CLOUDBASE_DOMAIN:-cloudbase.local}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.service=api@internal"

  homepage:
    image: nginx:alpine
    container_name: cloudbase-homepage
    ports:
      - "${HOMEPAGE_PORT:-8080}:80"
    volumes:
      - ./homepage:/usr/share/nginx/html:ro
    restart: unless-stopped
    networks:
      - cloudbase
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homepage.rule=Host(`homepage.${CLOUDBASE_DOMAIN:-cloudbase.local}`)"
      - "traefik.http.routers.homepage.entrypoints=websecure"
      - "traefik.http.routers.homepage.tls=true"
      - "traefik.http.services.homepage.loadbalancer.server.port=80"

  nextcloud:
    image: nextcloud:29
    container_name: cloudbase-nextcloud
    ports:
      - "${NEXTCLOUD_PORT:-8081}:80"
    environment:
      MYSQL_HOST: mariadb
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: localhost nextcloud.${CLOUDBASE_DOMAIN:-cloudbase.local}
      # Trust the Traefik proxy (pinned Docker subnet) so Nextcloud honours
      # X-Forwarded-Proto and generates correct https URLs behind the proxy.
      TRUSTED_PROXIES: ${CLOUDBASE_SUBNET:-172.28.0.0/16}
    volumes:
      - nextcloud_data:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - cloudbase
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextcloud.rule=Host(`nextcloud.${CLOUDBASE_DOMAIN:-cloudbase.local}`)"
      - "traefik.http.routers.nextcloud.entrypoints=websecure"
      - "traefik.http.routers.nextcloud.tls=true"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=80"

  mariadb:
    image: mariadb:lts
    container_name: cloudbase-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - cloudbase
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:alpine
    container_name: cloudbase-redis
    restart: unless-stopped
    networks:
      - cloudbase
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  adminer:
    image: adminer:latest
    container_name: cloudbase-adminer
    ports:
      - "${ADMINER_PORT:-8082}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mariadb
      ADMINER_DESIGN: dracula
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cloudbase
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adminer.rule=Host(`adminer.${CLOUDBASE_DOMAIN:-cloudbase.local}`)"
      - "traefik.http.routers.adminer.entrypoints=websecure"
      - "traefik.http.routers.adminer.tls=true"
      - "traefik.http.services.adminer.loadbalancer.server.port=8080"

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: cloudbase-uptime-kuma
    ports:
      - "${UPTIMEKUMA_PORT:-8083}:3001"
    volumes:
      - uptimekuma_data:/app/data
    restart: unless-stopped
    networks:
      - cloudbase
    healthcheck:
      test: ["CMD", "extra/healthcheck"]
      interval: 60s
      timeout: 30s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime.rule=Host(`uptime.${CLOUDBASE_DOMAIN:-cloudbase.local}`)"
      - "traefik.http.routers.uptime.entrypoints=websecure"
      - "traefik.http.routers.uptime.tls=true"
      - "traefik.http.services.uptime.loadbalancer.server.port=3001"

volumes:
  nextcloud_data:
    name: cloudbase_nextcloud_data
  mariadb_data:
    name: cloudbase_mariadb_data
  uptimekuma_data:
    name: cloudbase_uptimekuma_data

networks:
  cloudbase:
    driver: bridge
    name: cloudbase_network
    ipam:
      config:
        - subnet: ${CLOUDBASE_SUBNET:-172.28.0.0/16}
