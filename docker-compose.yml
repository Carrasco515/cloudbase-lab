services:

  traefik:
    image: traefik:v3.6
    container_name: cloudbase-traefik
    command:
      # --- Providers ---
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=cloudbase_network"
      # --- Entrypoints ---
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Redirect all plain HTTP to HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # --- Dashboard (served over the secure entrypoint, local hostname only) ---
      - "--api.dashboard=true"
      - "--log.level=INFO"
      # NOTE: No certificate resolver configured yet, so Traefik serves its
      # built-in self-signed certificate on :443. Enable Let's Encrypt only
      # once a real, publicly resolvable domain is configured (see README).
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Read-only access to the Docker API for service discovery.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - cloudbase
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${CLOUDBASE_DOMAIN:-cloudbase.local}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.service=api@internal"

  homepage:
    image: nginx:alpine
    container_name: cloudbase-homepage
    ports:
      - "${HOMEPAGE_PORT:-8080}:80"
    volumes:
      - ./homepage:/usr/share/nginx/html:ro
    restart: unless-stopped
    networks:
      - cloudbase
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homepage.rule=Host(`homepage.${CLOUDBASE_DOMAIN:-cloudbase.local}`)"
      - "traefik.http.routers.homepage.entrypoints=websecure"
      - "traefik.http.routers.homepage.tls=true"
      - "traefik.http.services.homepage.loadbalancer.server.port=80"
      # Non-critical, stateless service — safe to auto-update via Watchtower.
      - "com.centurylinklabs.watchtower.enable=true"

  nextcloud:
    image: nextcloud:29
    container_name: cloudbase-nextcloud
    ports:
      - "${NEXTCLOUD_PORT:-8081}:80"
    environment:
      MYSQL_HOST: mariadb
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: localhost nextcloud.${CLOUDBASE_DOMAIN:-cloudbase.local}
      # Trust the Traefik proxy (pinned Docker subnet) so Nextcloud honours
      # X-Forwarded-Proto and generates correct https URLs behind the proxy.
      TRUSTED_PROXIES: ${CLOUDBASE_SUBNET:-172.28.0.0/16}
    volumes:
      - nextcloud_data:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - cloudbase
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextcloud.rule=Host(`nextcloud.${CLOUDBASE_DOMAIN:-cloudbase.local}`)"
      - "traefik.http.routers.nextcloud.entrypoints=websecure"
      - "traefik.http.routers.nextcloud.tls=true"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=80"

  mariadb:
    image: mariadb:lts
    container_name: cloudbase-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - cloudbase
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:alpine
    container_name: cloudbase-redis
    restart: unless-stopped
    networks:
      - cloudbase
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  adminer:
    image: adminer:latest
    container_name: cloudbase-adminer
    ports:
      - "${ADMINER_PORT:-8082}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mariadb
      ADMINER_DESIGN: dracula
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cloudbase
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adminer.rule=Host(`adminer.${CLOUDBASE_DOMAIN:-cloudbase.local}`)"
      - "traefik.http.routers.adminer.entrypoints=websecure"
      - "traefik.http.routers.adminer.tls=true"
      - "traefik.http.services.adminer.loadbalancer.server.port=8080"
      # Non-critical, stateless service — safe to auto-update via Watchtower.
      - "com.centurylinklabs.watchtower.enable=true"

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: cloudbase-uptime-kuma
    ports:
      - "${UPTIMEKUMA_PORT:-8083}:3001"
    volumes:
      - uptimekuma_data:/app/data
    restart: unless-stopped
    networks:
      - cloudbase
    # Uptime Kuma runs inside the container and does not know the host's
    # /etc/hosts entries for *.cloudbase.local. Map each Traefik hostname to the
    # Docker host gateway so HTTPS monitors reach Traefik (which routes by Host
    # header). The local cert is self-signed, so enable "Ignore TLS error" on
    # each HTTPS monitor. See docs/monitoring.md.
    extra_hosts:
      - "homepage.${CLOUDBASE_DOMAIN:-cloudbase.local}:host-gateway"
      - "nextcloud.${CLOUDBASE_DOMAIN:-cloudbase.local}:host-gateway"
      - "adminer.${CLOUDBASE_DOMAIN:-cloudbase.local}:host-gateway"
      - "traefik.${CLOUDBASE_DOMAIN:-cloudbase.local}:host-gateway"
      - "portainer.${CLOUDBASE_DOMAIN:-cloudbase.local}:host-gateway"
      - "vaultwarden.${CLOUDBASE_DOMAIN:-cloudbase.local}:host-gateway"
      - "uptime.${CLOUDBASE_DOMAIN:-cloudbase.local}:host-gateway"
    healthcheck:
      test: ["CMD", "extra/healthcheck"]
      interval: 60s
      timeout: 30s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime.rule=Host(`uptime.${CLOUDBASE_DOMAIN:-cloudbase.local}`)"
      - "traefik.http.routers.uptime.entrypoints=websecure"
      - "traefik.http.routers.uptime.tls=true"
      - "traefik.http.services.uptime.loadbalancer.server.port=3001"

  portainer:
    image: portainer/portainer-ce:lts
    container_name: cloudbase-portainer
    command: -H unix:///var/run/docker.sock
    ports:
      - "${PORTAINER_PORT:-8084}:9000"
    volumes:
      # Portainer manages the Docker host, so it needs read-write access to the
      # socket (unlike Traefik, which only reads it for discovery). Keep local-only.
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped
    networks:
      - cloudbase
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.${CLOUDBASE_DOMAIN:-cloudbase.local}`)"
      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.routers.portainer.tls=true"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: cloudbase-vaultwarden
    environment:
      # Full external URL — required for WebAuthn/FIDO2 and correct links
      # generated by the apps. Uses the Traefik hostname.
      DOMAIN: "https://vaultwarden.${CLOUDBASE_DOMAIN:-cloudbase.local}"
      # Safe default: registration is CLOSED. Flip to true briefly to create
      # your first account, then set it back to false (see README). Leaving
      # signups open lets anyone who can reach the URL create an account.
      SIGNUPS_ALLOWED: "${VAULTWARDEN_SIGNUPS_ALLOWED:-false}"
      # The /admin panel stays disabled while this is empty (safe default).
      # Set a self-generated Argon2 token to enable it — never commit a real
      # token (see README).
      ADMIN_TOKEN: "${VAULTWARDEN_ADMIN_TOKEN:-}"
    volumes:
      - vaultwarden_data:/data
    ports:
      # Bound to localhost only: a password manager must not be reachable from
      # the LAN/internet. Use Traefik (HTTPS) or http://localhost:8085 locally.
      - "127.0.0.1:${VAULTWARDEN_PORT:-8085}:80"
    restart: unless-stopped
    networks:
      - cloudbase
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`vaultwarden.${CLOUDBASE_DOMAIN:-cloudbase.local}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden.tls=true"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"

  watchtower:
    image: containrrr/watchtower
    container_name: cloudbase-watchtower
    environment:
      # The published containrrr/watchtower image ships an old Docker client
      # (API 1.25); modern daemons require >= 1.44. Pin the negotiated API
      # version so the client talks to the daemon instead of crash-looping.
      DOCKER_API_VERSION: "1.44"
      # Run the update check on a cron schedule (6-field, with seconds).
      # Default: every day at 04:00, i.e. after the 03:00 backup timer.
      WATCHTOWER_SCHEDULE: "${WATCHTOWER_SCHEDULE:-0 0 4 * * *}"
      # Opt-in strategy: only update containers that explicitly carry the
      # label com.centurylinklabs.watchtower.enable=true. Everything else
      # (Nextcloud, MariaDB, Redis, Traefik, …) is left untouched.
      WATCHTOWER_LABEL_ENABLE: "true"
      # Remove the old image after a successful update.
      WATCHTOWER_CLEANUP: "true"
      # Local timezone so the schedule matches wall-clock time (default UTC).
      TZ: ${TZ:-UTC}
    volumes:
      # Watchtower pulls images and recreates containers, so it needs
      # read-write access to the Docker socket. Keep local-only.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - cloudbase

volumes:
  nextcloud_data:
    name: cloudbase_nextcloud_data
  mariadb_data:
    name: cloudbase_mariadb_data
  uptimekuma_data:
    name: cloudbase_uptimekuma_data
  portainer_data:
    name: cloudbase_portainer_data
  vaultwarden_data:
    name: cloudbase_vaultwarden_data

networks:
  cloudbase:
    driver: bridge
    name: cloudbase_network
    ipam:
      config:
        - subnet: ${CLOUDBASE_SUBNET:-172.28.0.0/16}
